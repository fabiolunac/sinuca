<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinuca">
<meta name="theme-color" content="#04190c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sinuca</title>
<style>
  :root {
    --bg: #04190c;
    --card-a1: #15803d; --card-a2: #22a35a;
    --card-b1: #0f4d2a; --card-b2: #166b3b;
    --text: #f2fbf4;
    --muted: rgba(242, 251, 244, .75);
    --glass: rgba(255, 255, 255, .1);
    --glass-strong: rgba(255, 255, 255, .2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; color: var(--text);
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    overscroll-behavior: none; }
  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(34, 163, 90, .3), transparent 50%),
      radial-gradient(circle at 90% 100%, rgba(21, 128, 61, .25), transparent 50%),
      var(--bg);
    display: flex; flex-direction: column; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);
  }

  .cards { flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 16px; }
  .player { width: 100%; max-width: 420px; height: min(34vh, 320px); position: relative; overflow: hidden; border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .15);
    transition: transform .12s ease, box-shadow .3s ease; }
  .player:active { transform: scale(.98); }
  #p0 { background: linear-gradient(135deg, var(--card-a1), var(--card-a2)); }
  #p1 { background: linear-gradient(135deg, var(--card-b1), var(--card-b2)); }
  .player::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .18), transparent 55%); }
  .player.leader { box-shadow: 0 0 0 2px rgba(255, 255, 255, .55), 0 0 40px rgba(134, 239, 172, .55),
    0 10px 30px rgba(0, 0, 0, .35); }

  .name { position: relative; font-size: 1.05rem; font-weight: 600; letter-spacing: .02em;
    padding: 6px 16px; border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--muted); }
  .crown { display: none; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; vertical-align: middle; background: #bbf7d0; box-shadow: 0 0 10px #bbf7d0; }
  .leader .crown { display: inline-block; }
  .score { position: relative; font-size: min(20vh, 32vw); font-weight: 800; line-height: 1;
    letter-spacing: -.04em; font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
  .score.pop { animation: pop .25s ease; }
  @keyframes pop { 50% { transform: scale(1.12); } }

  .minus { position: absolute; right: 14px; bottom: 14px; width: 48px; height: 48px;
    border-radius: 50%; border: 1px solid rgba(255, 255, 255, .2); background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--text); font-size: 1.6rem; line-height: 1; }
  .minus:active { background: var(--glass-strong); }

  .bar { display: flex; gap: 10px; width: 100%; max-width: 420px; align-self: center; }
  .bar button { flex: 1; padding: 14px; border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, .12); background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--text); font: inherit; font-size: .95rem; font-weight: 600; }
  .bar button:active { background: var(--glass-strong); }
</style>
</head>
<body>
  <div class="cards">
    <div class="player" id="p0" data-i="0">
      <div class="name"><span class="label"></span><span class="crown"></span></div>
      <div class="score"></div>
      <button class="minus" aria-label="Diminuir">−</button>
    </div>
    <div class="player" id="p1" data-i="1">
      <div class="name"><span class="label"></span><span class="crown"></span></div>
      <div class="score"></div>
      <button class="minus" aria-label="Diminuir">−</button>
    </div>
  </div>
  <div class="bar">
    <button id="undo">Desfazer</button>
    <button id="reset">Zerar</button>
  </div>

<script>
const KEY = 'sinuca-v1';
let state = { names: ['Eu', 'Amigo'], scores: [0, 0], history: [] };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
function render(changed) {
  const [a, b] = state.scores;
  document.querySelectorAll('.player').forEach(el => {
    const i = +el.dataset.i;
    el.querySelector('.label').textContent = state.names[i];
    const s = el.querySelector('.score');
    s.textContent = state.scores[i];
    el.classList.toggle('leader', a !== b && state.scores[i] === Math.max(a, b));
    if (i === changed) { s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
  });
}
function change(i, d) {
  if (state.scores[i] + d < 0) return;
  state.history.push(state.scores.slice());
  if (state.history.length > 200) state.history.shift();
  state.scores[i] += d;
  save(); render(i);
}

document.querySelectorAll('.player').forEach(el => {
  const i = +el.dataset.i;
  el.addEventListener('click', e => {
    if (e.target.closest('.minus')) return change(i, -1);
    if (e.target.closest('.name')) {
      const n = prompt('Nome do jogador', state.names[i]);
      if (n && n.trim()) { state.names[i] = n.trim().slice(0, 20); save(); render(); }
      return;
    }
    change(i, 1);
  });
});
document.getElementById('undo').onclick = () => {
  const prev = state.history.pop();
  if (prev) { state.scores = prev; save(); render(); }
};
document.getElementById('reset').onclick = () => {
  if (confirm('Zerar o placar?')) {
    state.history.push(state.scores.slice());
    state.scores = [0, 0]; save(); render();
  }
};
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
